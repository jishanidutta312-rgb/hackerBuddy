<!DOCTYPE html>
<html lang="en" class="logpg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="../public/css/styles.css"/>
</head>
<body>
    <div class="container">
        <div class="form">
            <h1 class="welcome">Welcome back!👋</h1> 
            <p class="log">Login to continue</p>
            <input type="email" pattern=".+@example\.com"  placeholder="Email"/>
            <div class="pass">
                <input type="password" placeholder="Password"/>
                <button class="forgot">Forgot password?</button>
            </div>
            <button class="btn">Login</button>
            <div class="para">
                <hr/>
                <p>or continue with</p>
                <hr/>
            </div>
            <div class="gbtn">
                <button >
                    <img class="google" src="../public/images/google.jpeg"/>
                    Google    
                </button>
                <button>
                    <img class="git" src="../public/images/gitHub.jpeg"/>
                    GitHub
                </button>
            </div>
        </div>  
    </div>
</body>
</html>
