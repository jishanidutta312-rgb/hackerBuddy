<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="../public/css/styles.css"/>
</head>
<body>
    <div class="container">
        <div class="form">
            <h1>Create your 🚀<br/>hackerBuddy account.</h1> 
            <input type="name" placeholder="Full Name"/>
            <input type="email" pattern=".+@example\.com"  placeholder="Email"/>
            <input type="password" placeholder="Password"/>
            <button class="btn">Sign Up</button>
            <div class="para">
                <hr/>
                <p>or continue with</p>
                <hr/>
            </div>
            <div class="gbtn">
                <button >
                    <img class="google" src="../public/images/google.jpeg"/>
                    Google    
                </button>
                <button>
                    <img class="git" src="../public/images/gitHub.jpeg"/>
                    GitHub
                </button>
            </div>
            <p>Already have an acount?<span class="purple">login</span></p>

        </div>
        <img class="sign" src="../public/images/signUp.jpeg"/>
    </div>
</body>
</html>
