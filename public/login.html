<!DOCTYPE html>
<html lang="en" class="logpg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
    <div class="container">
        <div class="form">
            <h1 class="welcome">Welcome back!👋</h1> 
            <p class="log">Login to continue</p>
            <input type="email" pattern=".+@example\.com"  placeholder="Email"/>
            <div class="pass">
                <input type="password" placeholder="Password"/>
                <button class="forgot">Forgot password?</button>
            </div>
                <form action="/login" method="POST">
                <button type="submit" class="btn">Login</button>
                </form>
            <div class="para">
                <hr/>
                <p>or continue with</p>
                <hr/>
            </div>
            <div class="gbtn">
                <button >
                    <img class="google" src="./images/google.jpeg"/>
                    Google    
                </button>
                <button>
                    <img class="git" src="./images/gitHub.jpeg"/>
                    GitHub
                </button>
            </div>
        </div>  
    </div>
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script src="./js/script.js"> charset="UTF-8" </script>
</body>
</html>
