<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hacker Buddy</title>
    <link rel="stylesheet" href="./css/index.css"/>
</head>
<body>
<div class="icons">
    <div class="top">
        <img src="./images/logo.png" alt="logo"/>
        <h1 class="logo">hackerBuddy</h2>
    </div>
    <h2 id="purple">home</h2>
    <a href="/explore"><h2>Explore</h2></a>
    <a href="/hackathons"><h2>Hackathons</h2></a>
    <a href="/how_It_Works"><h2>How it works</h2></a>
    <a href="/about"><h2>about</h2></a>
    <div class="page">
        <form action="/login" method="get">
            <button type="submit" id="login">Login</button>
        </form>
        <form action="/signup" method="get">
            <button id="sign">Sign Up</button>
        </form>
    </div>
</div>
<div class="hero">
    <div class="headline">
        <h1>Find the Right<br/>Teammates.</h1>
        <h1 class="purple">Build Amazing Projects.</h1>
        <p>hackerBuddy helps developers find teammates for hackathons,<br/>projects and turn ideas into reality.</p>
        <a href="/signup"><button id="start">
            Get Started
            <img src="./images/arrow.jpeg" alt="arrow sign"/>
        </button></a> 
        <a href="/signup"><button>Explore Teams</button></a>
    </div>
    <img src="./images/hero.jpeg" alt="hero image"/>
</div>
<div class="card">
    <button>
        <img src="./images/matching.jpeg" alt="matching img"/>
        <div>
            <h1>Smart Matching</h1>
            <p>Find developers with<br/>the right skills</p>
        </div>
    </button>
    <button>
        <img src="./images/team.jpeg" alt="team image"/>
        <div>
            <h1>Team Creation</h1>
            <p>Create or join<br/>winning teams</p>
        </div>
    </button>
    <button>
        <img src="./images/chat.jpeg" alt="chat image"/>
        <div>
            <h1>Live Chat</h1>
            <p>Connect and<br/>collaborate</p>
        </div>
    </button>
    <button>
        <img src="./images/hackathon.jpeg" alt="hackathon image"/>
        <div>
            <h1>Hackathon Hub</h1>
            <p>Discover upcoming<br/>hackathons</p>
        </div>
    </button>
</div>

<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script src="./js/script.js"> charset="UTF-8" </script>
</body>
</html>
