<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="./css/styles.css"/>
</head>
<script>
  document.getElementById("signup-form").addEventListener("submit", function (e) {
    const usernameInput = document.getElementById("username") || document.querySelector('input[name="username"]');
    const enteredName = usernameInput && usernameInput.value.trim() ? usernameInput.value.trim() : "Builder";

   
    localStorage.removeItem("hackerBuddyUser");

   
    const freshUser = {
      name: enteredName,
      role: "",
      college: "",
      bio: "",
      skills: [],
      participations: 0,
      invitesCount: 0,
      activeSquad: "No Active Squad"
    };

    localStorage.setItem("hackerBuddyUser", JSON.stringify(freshUser));
  });
</script>
<body>
    <div class="container">
        <div class="form">
            <h1>Create your 🚀<br/>hackerBuddy account.</h1>
            <form id="signup-form" action="/signup" method="POST">
                <input type="text" id="username" name="username" placeholder="Username" required />
                <input type="email" name="email" minlength="6" placeholder="Email"required/>
                <input type="password" name="password" placeholder="Password"required/>
                <button type="submit" class="btn">Sign Up</button>
            </form> 
            <div class="para">
                <hr/>
                <p>or continue with</p>
                <hr/>
            </div>
            <div class="gbtn">
                <button >
                    <img class="google" src="./images/google.jpeg"/>
                    Google    
                </button>
                <button>
                    <img class="git" src="./images/gitHub.jpeg"/>
                    GitHub
                </button>
            </div>
            <p>Already have an acount? <a href="/login" class="purple">login</a></p>

        </div>
        <img class="sign" src="./images/signUp.jpeg"/>
    </div>
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script src="./js/signup.js"> charset="UTF-8" </script>
</body>
</html>
